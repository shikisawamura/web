<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIKI SAWAMURA | 澤村 思輝</title>
    <meta name="description" content="photo by shiki sawamura / 澤村 思輝, Leica">
    <meta name="keywords" content="澤村 思輝, shiki sawamura">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="canonical" href="https://shikisawamura.github.io/web/" />
    <style>
        /* ネイティブのスクロールを完全に防ぎ、画面を固定 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh; /* スマホブラウザのUIバーによる高さズレ防止 */
            overflow: hidden; 
        }

        header {
            position: fixed;
            top: 0;
            left: 1vw;
            background-color: transparent;
            padding: 10px;
            margin-bottom: 0;
            width: 100%;
            box-shadow: 0 0 0 rgba(0, 0, 0, 0);
            z-index: 1000;
            color: #666;
            font-size: 0.75em;
            font-family: 'Open Sans', sans-serif;
            font-weight: 300;
            height: 10vh;
            display: flex;
            align-items: center;
        }
        header h1 {
            margin: 0;
            height: 10vh;
            display: flex;
            align-items: center;
        }
        #loading-message {
            display: none;
            text-align: center;
            padding: 10px;
            flex-shrink: 0;
        }

        /* コンテナ設定 */
        #photo-container {
            display: flex;
            align-items: center; /* 【追加】PCでの上下中央寄せ＆スマホでの左右中央寄せ */
            flex-wrap: nowrap;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow-x: hidden; 
            overflow-y: hidden; 
            scrollbar-width: none;
            -ms-overflow-style: none;
            cursor: grab;
            touch-action: none; 
        }
        #photo-container::-webkit-scrollbar {
            display: none;
        }

        #photo-container img {
            flex-shrink: 0; 
            max-height: 80vh;
            width: auto;
            margin-right: 15px; /* PCでの画像間隔 */
            transition: opacity 0.5s ease;
            cursor: pointer;
        }

        /* PC表示時の最初と最後の余白 */
        #photo-container img:first-of-type {
            margin-left: 20px;
        }
        #photo-container img:last-of-type {
            margin-right: 20px;
        }

        /* スマホ（縦長画面）向けの画像スタイル調整 */
        @media (max-aspect-ratio: 1/1) {
            #photo-container {
                flex-direction: column;
                /* 【修正】padding-topを削除し、ヘッダー裏の回り込みを許可 */
            }
            #photo-container img {
                max-height: none;
                width: 90vw; /* 【修正】100vwから90vwにし、左右に5vwずつの白余白を確保 */
                height: auto;
                margin-right: 0; /* PC用の余白をリセット */
                margin-bottom: 25px; /* 画像と画像の縦の間隔 */
            }
            #photo-container img:first-of-type {
                margin-top: 10vh; /* 【修正】最初の画像だけヘッダーに隠れないように位置を下げる */
                margin-left: 0;
            }
            #photo-container img:last-of-type {
                margin-right: 0;
                margin-bottom: 10vh; /* 最後の画像の下余白 */
            }
        }
    </style>
</head>
<body>
    <header>
        <h1 id="site-title">SHIKI SAWAMURA</h1>
    </header>
    <main id="photo-container">
        <p id="loading-message">Loading...</p>
    </main>
    <footer>
        <a href="about.html">About</a>
    </footer>
    <script>
        const firstImageId = 'image_0';

        function adjustHeaderFooterSize() {
            const windowHeight = window.innerHeight;
            const header = document.querySelector('header');
            const footer = document.querySelector('footer');
            if(header) {
                const headerPadding = windowHeight * 0.01;
                header.style.padding = `${headerPadding}px`;
            }
        }

        adjustHeaderFooterSize();
        window.addEventListener('resize', adjustHeaderFooterSize);

        document.addEventListener('DOMContentLoaded', function () {
            const photoContainer = document.getElementById('photo-container');
            const loadingMessage = document.getElementById('loading-message');
            const initialImageCount = 20;
            const imagesPerPage = 20;
            const totalImages = 640;
            const imagePaths = generateImagePaths(totalImages);
            let isLoading = false;
            let currentIndex = initialImageCount;
            let displayedIndex = 0;

            function generateImagePaths(count) {
                const paths = [];
                for (let i = count; i >= 1; i--) {
                    const paddedIndex = i.toString().padStart(4, '0');
                    paths.push(`images/photo${paddedIndex}.jpg`);
                }
                return paths;
            }

            function appendImage(path, index) {
                const img = new Image();
                img.alt = '';
                img.style.opacity = '0';
                img.id = 'image_' + index;
                
                // 【追加】画像のネイティブ読み込み高速化（Lazy Load）と非同期デコード
                img.loading = 'lazy';
                img.decoding = 'async';

                img.onload = function () {
                    img.style.opacity = '1';
                };
                img.src = path;

                photoContainer.insertBefore(img, loadingMessage);
                
                img.addEventListener('click', function() {
                    centerImage(this);
                });
            }

            function loadNextImage() {
                if (currentIndex < totalImages) {
                    appendImage(imagePaths[currentIndex], displayedIndex);
                    currentIndex++;
                    displayedIndex++;
                }
            }

            function centerImage(img) {
                const isWideScreen = window.innerWidth > window.innerHeight;
                if (isWideScreen) {
                    const containerWidth = photoContainer.offsetWidth;
                    const imgWidth = img.offsetWidth;
                    const imgLeft = img.offsetLeft;
                    const targetScrollLeft = imgLeft - (containerWidth - imgWidth) / 2;
                    photoContainer.scrollTo({ left: targetScrollLeft, behavior: 'smooth' });
                } else {
                    const containerHeight = photoContainer.offsetHeight;
                    const imgHeight = img.offsetHeight;
                    const imgTop = img.offsetTop;
                    const targetScrollTop = imgTop - (containerHeight - imgHeight) / 2;
                    photoContainer.scrollTo({ top: targetScrollTop, behavior: 'smooth' });
                }
            }

            // === 慣性スクロールの処理 ===
            let isDragging = false;
            let startPos = 0;
            let scrollStart = 0;
            let currentPos = 0;
            let velocity = 0;
            let previousPos = 0;
            let previousTime = 0;
            let animationFrameId;

            function handleStart(e) {
                isDragging = true;
                cancelAnimationFrame(animationFrameId);
                photoContainer.style.cursor = 'grabbing';
                
                const isWideScreen = window.innerWidth > window.innerHeight;
                const pageX = e.type.includes('touch') ? e.touches[0].pageX : e.pageX;
                const pageY = e.type.includes('touch') ? e.touches[0].pageY : e.pageY;
                
                startPos = isWideScreen ? pageX : pageY;
                scrollStart = isWideScreen ? photoContainer.scrollLeft : photoContainer.scrollTop;
                
                previousPos = startPos;
                previousTime = Date.now();
                velocity = 0;
            }

            function handleMove(e) {
                if (!isDragging) return;
                if (e.cancelable) e.preventDefault(); 
                
                const isWideScreen = window.innerWidth > window.innerHeight;
                const pageX = e.type.includes('touch') ? e.touches[0].pageX : e.pageX;
                const pageY = e.type.includes('touch') ? e.touches[0].pageY : e.pageY;
                
                currentPos = isWideScreen ? pageX : pageY;
                const walk = (startPos - currentPos);
                
                if (isWideScreen) {
                    photoContainer.scrollLeft = scrollStart + walk;
                } else {
                    photoContainer.scrollTop = scrollStart + walk;
                }

                const currentTime = Date.now();
                const timeDelta = currentTime - previousTime;
                
                if (timeDelta > 0) {
                    velocity = (previousPos - currentPos) / timeDelta;
                }
                
                previousPos = currentPos;
                previousTime = currentTime;
            }

            function handleEnd() {
                isDragging = false;
                photoContainer.style.cursor = 'grab';
                applyMomentum();
            }

            function applyMomentum() {
                if (Math.abs(velocity) > 0.05) {
                    const isWideScreen = window.innerWidth > window.innerHeight;
                    if (isWideScreen) {
                        photoContainer.scrollLeft += velocity * 15;
                    } else {
                        photoContainer.scrollTop += velocity * 15;
                    }
                    velocity *= 0.95;
                    animationFrameId = requestAnimationFrame(applyMomentum);
                }
            }

            photoContainer.addEventListener('mousedown', handleStart);
            photoContainer.addEventListener('mousemove', handleMove);
            photoContainer.addEventListener('mouseup', handleEnd);
            photoContainer.addEventListener('mouseleave', handleEnd);
            
            photoContainer.addEventListener('touchstart', handleStart, { passive: false });
            photoContainer.addEventListener('touchmove', handleMove, { passive: false });
            photoContainer.addEventListener('touchend', handleEnd);
            photoContainer.addEventListener('touchcancel', handleEnd);

            for (let i = 0; i < initialImageCount; i++) {
                appendImage(imagePaths[i], i);
                displayedIndex++;
            }

            window.addEventListener('wheel', function (event) {
                const isWideScreen = window.innerWidth > window.innerHeight;
                if (isWideScreen) {
                    photoContainer.scrollLeft += event.deltaY;
                    event.preventDefault();
                } else {
                    photoContainer.scrollTop += event.deltaY;
                    event.preventDefault();
                }
            }, { passive: false });

            // 追加画像ロード
            photoContainer.addEventListener('scroll', function () {
                const isWideScreen = window.innerWidth > window.innerHeight;
                let isNearEnd = false;

                if (isWideScreen) {
                    isNearEnd = photoContainer.scrollLeft >= (photoContainer.scrollWidth - photoContainer.offsetWidth - 200);
                } else {
                    isNearEnd = photoContainer.scrollTop >= (photoContainer.scrollHeight - photoContainer.offsetHeight - 200);
                }

                if (!isLoading && isNearEnd) {
                    isLoading = true;
                    loadingMessage.style.display = 'block';
                    setTimeout(function () {
                        for (let i = 0; i < imagesPerPage; i++) {
                            if (currentIndex < totalImages) {
                                loadNextImage();
                            }
                        }
                        isLoading = false;
                        loadingMessage.style.display = 'none';
                    }, 300); // 待機時間を1000msから300msに短縮し、ロードを高速化
                }
            });

            function updateStyles() {
                const isWideScreen = window.innerWidth > window.innerHeight;
                if (isWideScreen) {
                    photoContainer.style.flexDirection = 'row';
                } else {
                    photoContainer.style.flexDirection = 'column';
                }
            }

            window.addEventListener('resize', updateStyles);
            updateStyles();
        });
    </script>
</body>
</html>
