<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIKI SAWAMURA | 澤村 思輝</title>
    <meta name="description" content="photo by shiki sawamura / 澤村 思輝, Leica">
    <meta name="keywords" content="澤村 思輝, shiki sawamura">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300&display=swap" rel="stylesheet">
    <link rel="canonical" href="https://shikisawamura.github.io/web/" />
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; 
            height: 100dvh; overflow: hidden; 
            background-color: #f8f8f8; color: #333;
        }

        body.hide-cursor { cursor: none !important; }

        header, footer, #fs-btn {
            position: fixed; z-index: 1000; background-color: transparent;
            font-family: 'Open Sans', sans-serif; font-weight: 300;
            color: #666; transition: opacity 0.6s ease;
        }
        header { top: 0; left: 1vw; padding: 10px; font-size: 0.75em; height: 10vh; display: flex; align-items: center; }
        header h1 { margin: 0; }
        footer { bottom: 0; left: 1vw; padding: 10px; font-size: 16px; text-decoration: underline; width: 100%; }
        footer a { color: inherit; text-decoration: none; }

        /* フルスクリーンボタンのスタイル */
        #fs-btn {
            top: 10px; right: 1vw; height: 10vh; padding: 10px;
            border: none; font-size: 0.75em; cursor: pointer;
            display: none; /* 初期状態は非表示（JSで判定して表示） */
            align-items: center; letter-spacing: 0.05em;
        }

        /* スクロール中のUIフェードアウト */
        body.is-scrolling header, 
        body.is-scrolling footer, 
        body.is-scrolling #fs-btn {
            opacity: 0 !important; pointer-events: none;
        }

        #photo-container {
            display: flex; align-items: center; flex-wrap: nowrap;
            width: 100vw; height: 100vh; height: 100dvh;
            overflow-x: auto; overflow-y: hidden; 
            -webkit-overflow-scrolling: touch; 
            scrollbar-width: none; -ms-overflow-style: none;
        }
        #photo-container::-webkit-scrollbar { display: none; }

        #photo-container img {
            flex-shrink: 0; max-height: 80vh; width: auto;
            margin-right: 15px; cursor: pointer;
            -webkit-user-drag: none; user-select: none; 
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
            transform-origin: center center; will-change: transform;
        }
        
        body.is-fast-scrolling #photo-container img { transform: scale(0.97); }

        #photo-container img:first-of-type { margin-left: 20px; }
        #photo-container img:last-of-type { margin-right: 20px; }

        @media (max-aspect-ratio: 1/1) {
            #photo-container { flex-direction: column; overflow-x: hidden; overflow-y: auto; }
            #photo-container img { width: 90vw; max-height: none; height: auto; margin-right: 0; margin-bottom: 25px; }
            #photo-container img:first-of-type { margin-top: 10vh; margin-left: 0; }
            #photo-container img:last-of-type { margin-right: 0; margin-bottom: 10vh; }
        }
    </style>
</head>
<body>
    <header>
        <h1 id="site-title">SHIKI SAWAMURA</h1>
    </header>
    
    <!-- フルスクリーンボタン -->
    <button id="fs-btn">FULLSCREEN</button>

    <main id="photo-container"></main>
    
    <footer>
        <a href="about.html">About</a>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const photoContainer = document.getElementById('photo-container');
            const totalImages = 678;
            const imagesPerPage = 20;
            const imagePaths = generateImagePaths(totalImages);
            let isLoading = false;
            let currentIndex = 0; 
            let displayedIndex = 0;

            // === フルスクリーン機能の判定と実装 ===
            const fsBtn = document.getElementById('fs-btn');
            // ブラウザがフルスクリーンAPIをサポートしているか判定
            const fullscreenEnabled = document.fullscreenEnabled || document.webkitFullscreenEnabled;
            
            if (fullscreenEnabled) {
                fsBtn.style.display = 'flex'; // サポートしている場合のみ表示
                
                fsBtn.addEventListener('click', () => {
                    const doc = document.documentElement;
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        if (doc.requestFullscreen) doc.requestFullscreen();
                        else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
                    } else {
                        if (document.exitFullscreen) document.exitFullscreen();
                        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    }
                });

                // フルスクリーン状態の変更を監視してテキストを切り替え
                const updateFsBtnText = () => {
                    if (document.fullscreenElement || document.webkitFullscreenElement) {
                        fsBtn.textContent = 'EXIT';
                    } else {
                        fsBtn.textContent = 'FULLSCREEN';
                    }
                };
                document.addEventListener('fullscreenchange', updateFsBtnText);
                document.addEventListener('webkitfullscreenchange', updateFsBtnText);
            }

            function generateImagePaths(count) {
                const paths = [];
                for (let i = count; i >= 1; i--) {
                    const paddedIndex = i.toString().padStart(4, '0');
                    paths.push(`images/photo${paddedIndex}.jpg`);
                }
                return paths;
            }

            function appendImage(path, index) {
                const img = new Image();
                img.alt = '';
                img.style.opacity = '0';
                img.id = 'image_' + index;
                img.loading = 'lazy';
                img.decoding = 'async';
                img.onload = () => img.style.opacity = '1';
                img.src = path;
                
                photoContainer.appendChild(img);
                img.addEventListener('click', function() { centerImage(this); });
            }

            // 無限ループスクロール処理
            function loadNextImage() {
                const pathIndex = currentIndex % totalImages;
                appendImage(imagePaths[pathIndex], displayedIndex);
                currentIndex++;
                displayedIndex++;
            }

            for (let i = 0; i < 20; i++) loadNextImage();

            function centerImage(img) {
                const isWideScreen = window.innerWidth > window.innerHeight;
                if (isWideScreen) {
                    const targetScrollLeft = img.offsetLeft - (photoContainer.offsetWidth - img.offsetWidth) / 2;
                    photoContainer.scrollTo({ left: targetScrollLeft, behavior: 'smooth' });
                } else {
                    const targetScrollTop = img.offsetTop - (photoContainer.offsetHeight - img.offsetHeight) / 2;
                    photoContainer.scrollTo({ top: targetScrollTop, behavior: 'smooth' });
                }
            }

            // スクロール監視（UIフェードアウト＆呼吸エフェクト＆無限読み込み）
            let scrollTimeout;
            let lastScrollPos = 0;
            let lastScrollTime = Date.now();

            photoContainer.addEventListener('scroll', function () {
                const isWideScreen = window.innerWidth > window.innerHeight;
                const currentPos = isWideScreen ? photoContainer.scrollLeft : photoContainer.scrollTop;
                const currentTime = Date.now();
                
                document.body.classList.add('is-scrolling');

                const timeDiff = currentTime - lastScrollTime;
                if (timeDiff > 0) {
                    const speed = Math.abs(currentPos - lastScrollPos) / timeDiff;
                    if (speed > 1.2) document.body.classList.add('is-fast-scrolling');
                    else document.body.classList.remove('is-fast-scrolling');
                }
                lastScrollPos = currentPos;
                lastScrollTime = currentTime;

                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    document.body.classList.remove('is-scrolling');
                    document.body.classList.remove('is-fast-scrolling');
                }, 400); 

                let isNearEnd = isWideScreen 
                    ? photoContainer.scrollLeft >= (photoContainer.scrollWidth - photoContainer.offsetWidth - 800)
                    : photoContainer.scrollTop >= (photoContainer.scrollHeight - photoContainer.offsetHeight - 800);

                if (!isLoading && isNearEnd) {
                    isLoading = true;
                    for (let i = 0; i < imagesPerPage; i++) loadNextImage();
                    isLoading = false;
                }
            }, { passive: true });

            // PCでのマウスドラッグスクロール
            let isDragging = false, startPos = 0, scrollStart = 0;
            photoContainer.addEventListener('mousedown', (e) => {
                isDragging = true;
                const isWideScreen = window.innerWidth > window.innerHeight;
                startPos = isWideScreen ? e.pageX : e.pageY;
                scrollStart = isWideScreen ? photoContainer.scrollLeft : photoContainer.scrollTop;
            });
            photoContainer.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const isWideScreen = window.innerWidth > window.innerHeight;
                const currentPos = isWideScreen ? e.pageX : e.pageY;
                const walk = (startPos - currentPos);
                if (isWideScreen) photoContainer.scrollLeft = scrollStart + walk;
                else photoContainer.scrollTop = scrollStart + walk;
            });
            window.addEventListener('mouseup', () => isDragging = false);
            window.addEventListener('mouseleave', () => isDragging = false);

            window.addEventListener('wheel', function (e) {
                if (window.innerWidth > window.innerHeight) {
                    photoContainer.scrollLeft += e.deltaY;
                }
            }, { passive: true });

            // マウスカーソルの自動非表示
            let cursorTimeout;
            window.addEventListener('mousemove', () => {
                document.body.classList.remove('hide-cursor');
                clearTimeout(cursorTimeout);
                cursorTimeout = setTimeout(() => {
                    document.body.classList.add('hide-cursor');
                }, 2500); 
            });

            // 矢印キーでの操作
            window.addEventListener('keydown', function(e) {
                const images = Array.from(photoContainer.querySelectorAll('img'));
                if (!images.length) return;

                const isWideScreen = window.innerWidth > window.innerHeight;
                let centerPos = isWideScreen 
                    ? photoContainer.scrollLeft + photoContainer.offsetWidth / 2 
                    : photoContainer.scrollTop + photoContainer.offsetHeight / 2;

                let closestIndex = 0, minDistance = Infinity;
                images.forEach((img, index) => {
                    const imgCenter = isWideScreen 
                        ? img.offsetLeft + img.offsetWidth / 2 
                        : img.offsetTop + img.offsetHeight / 2;
                    const distance = Math.abs(imgCenter - centerPos);
                    if (distance < minDistance) { minDistance = distance; closestIndex = index; }
                });

                let targetIndex = closestIndex;
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                    targetIndex = Math.min(closestIndex + 1, images.length - 1);
                } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                    targetIndex = Math.max(closestIndex - 1, 0);
                }
                if (targetIndex !== closestIndex) centerImage(images[targetIndex]);
            });
        });
    </script>
</body>
</html>
