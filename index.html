    <style>
        header {
            position: fixed;
            top: 0;
            left: 1vw;
            background-color: transparent;
            padding: 10px;
            margin-bottom: 0;
            width: 100%;
            box-shadow: 0 0 0 rgba(0, 0, 0, 0);
            z-index: 1000;

            font-size: 0.75em;
            font-family: 'Open Sans', sans-serif;
            font-weight: 300;
            height: 10vh;

        header h1 {

            height: 10vh;
            display: flex;
            align-items: center;
        }
        #loading-message {
            display: none;
            text-align: center;
            padding: 10px;
        }
        #photo-container {
            display: flex;
            flex-wrap: nowrap;
            max-width: 100%;
            overflow-x: hidden; /* JSでスクロール制御するためhiddenに設定 */
            overflow-y: hidden; 
            scrollbar-width: none;
            -ms-overflow-style: none;
            cursor: grab;
            touch-action: none; /* スマホのブラウザ標準スクロールを無効化 */
        }
        #photo-container::-webkit-scrollbar {
            display: none;
        }
        #photo-container img {
            max-height: 80vh;
            width: auto;
            margin-right: 10px;
            transition: opacity 0.5s ease;
            cursor: pointer;
        }

        /* スマホ（縦長画面）向けの画像スタイル調整 */
        @media (max-aspect-ratio: 1/1) {
            #photo-container img {
                max-height: none;
                width: 100vw; /* 画面幅いっぱいに表示 */
                height: auto;
                margin-right: 0;
                margin-bottom: 10px; /* 下に余白をつける */
            }
        }
    </style>
